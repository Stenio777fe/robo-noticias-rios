name: Rios News Bot - Automação

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: Modo de execução
        required: false
        default: ambos
        type: choice
        options:
          - ambos
          - youtube
          - tendencias
      rascunho:
        description: Forçar rascunho
        required: false
        default: true
        type: boolean

concurrency:
  group: rios-news-bot
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Validar projeto
        run: python -m pytest -q
      - name: Executar robô
        env:
          WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL }}
          WORDPRESS_USUARIO: ${{ secrets.WORDPRESS_USUARIO }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_STATUS: ${{ vars.WORDPRESS_STATUS || 'publish' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IA_PROVEDOR: ${{ vars.IA_PROVEDOR || 'gemini' }}
        run: |
          MODO="${{ inputs.modo || 'ambos' }}"
          EXTRA=""
          if [ "${{ inputs.rascunho }}" = "true" ]; then EXTRA="--teste-rascunho"; fi
          python robo_rios.py --modo "$MODO" $EXTRA